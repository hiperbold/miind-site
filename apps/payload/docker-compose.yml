# Postgres 17 local do app Payload (Bu1lder). Porta 5438 só em 127.0.0.1.
services:
  postgres:
    image: postgres:17
    container_name: miind-bu1lder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: miind
      POSTGRES_PASSWORD: miind_local_dev
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:5438:5432'
    volumes:
      - miind_bu1lder_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U miind -d miind_bu1lder']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  miind_bu1lder_pgdata:
    name: miind_bu1lder_pgdata
